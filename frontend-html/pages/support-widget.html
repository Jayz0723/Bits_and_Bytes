<!DOCTYPE html>
<!-- Bits & Bytes, HTML and CSS edition. Open this folder’s index.html to start. -->
<html lang="en">
  <head>
    <!-- Resolve shared files from the project root, including on local file URLs. -->
    <base href="../">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Desk | Bits and Bytes</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/storefront.css?v=20261030-filters-v22">
    <link rel="stylesheet" href="css/support.css?v=20261015">
    <link rel="stylesheet" href="css/site-experience.css?v=20261026-cutouts-v6">
    <!-- Shared storefront styles above retain the original layout. Static controls below use native HTML and CSS. -->
    <link rel="stylesheet" href="css/static-edition.css">
  </head>
  <body class="support-widget-page">
    <!--  Page content. Product cards, articles and other catalog data below are written directly into this HTML.  -->
    <main>
      <p class="static-preview-note">Frontend preview. Live account, ordering and form features are available in the original storefront.</p>
      <form class="contact-form" data-support-form="">
        <p class="eyebrow">Talk to us</p>
        <h2>What can we help with?</h2>
        <div class="support-form-pair">
          <div>
            <label for="name">Name</label>
            <input id="name" name="name" autocomplete="name" placeholder="Your name" required="" maxlength="100" disabled="">
          </div>
          <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@email.com" required="" maxlength="254" disabled="">
          </div>
        </div>
        <label for="topic">Topic</label>
        <select id="topic" name="topic" disabled="">
        <option>Product question</option>
        <option>Build Your Own PC help</option>
        <option>Order support</option>
      </select>
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" placeholder="A model, a budget, or the question on your mind..." required="" maxlength="3000" disabled=""></textarea>
        <button class="button primary" type="submit" disabled="">Prepare Message <span aria-hidden="true">→</span></button>
        <p class="support-form-status" role="status"></p>
        <p class="support-demo-note">Prepare your message, then share it through our social profiles. This form does not send messages.</p>
        <section class="support-draft" hidden="">
          <h3>Your message draft</h3>
          <p></p>
          <a class="text-link" href="pages/contact.html" target="_top">Contact details &amp; FAQ <span aria-hidden="true">→</span></a>
        </section>
      </form>
    </main>
  </body>
</html>
