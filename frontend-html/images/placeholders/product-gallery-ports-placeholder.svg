  <rect x="90" y="90" width="1020" height="720" rx="12" fill="#111c24" stroke="#36505d" stroke-width="3" stroke-dasharray="18 14"/>
  <rect x="350" y="315" width="500" height="270" rx="18" fill="none" stroke="#35d0b5" stroke-width="18" opacity=".72"/>
