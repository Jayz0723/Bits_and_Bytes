<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Desk | Bits and Bytes</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="storefront.css?v=20261012">
  <link rel="stylesheet" href="support.css?v=20261015">
</head>
<body class="support-widget-page">
  <main>
    <form class="contact-form" data-support-form>
      <p class="eyebrow">Talk to us</p>
      <h2>What can we help with?</h2>
      <div class="support-form-pair">
        <div><label for="name">Name</label><input id="name" name="name" autocomplete="name" placeholder="Your name" required maxlength="100"></div>
        <div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@email.com" required maxlength="254"></div>
      </div>
      <label for="topic">Topic</label>
      <select id="topic" name="topic">
        <option>Product question</option>
        <option>Build Your Own PC help</option>
        <option>Order support</option>
      </select>
      <label for="message">Message</label>
      <textarea id="message" name="message" rows="4" placeholder="A model, a budget, or the question on your mind..." required maxlength="3000"></textarea>
      <button class="button primary" type="submit">Prepare Message <span aria-hidden="true">&rarr;</span></button>
      <p class="support-form-status" role="status"></p>
      <p class="support-demo-note">Store demo: messages are not sent. A draft opens below for review.</p>
      <section class="support-draft" hidden>
        <h3>Your message draft</h3>
        <p></p>
        <a class="text-link" href="contact.html" target="_top">Contact details &amp; FAQ <span aria-hidden="true">&rarr;</span></a>
      </section>
    </form>
  </main>
  <script src="support-form.js"></script>
</body>
</html>
